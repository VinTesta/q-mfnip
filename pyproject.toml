[project]
name = "qmfnip"
version = "0.1.0"
description = "Maximum Flow Network Interdiction: quantum minimum finding and its interface"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "psutil",
]

[project.optional-dependencies]
quantum = [
    "qiskit",
    "qiskit-aer",
    "qiskit-ibm-runtime",
]
dev = [
    "pytest",
    "ruff",
    "jupyterlab",
    "ipykernel",
    "nbconvert",
    "nbformat",
    "nbstripout",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmfnip"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"src/qmfnip/playground.py" = ["BLE001"]
"src/qmfnip/oracle.py" = ["BLE001"]
